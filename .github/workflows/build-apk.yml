name: Build Standalone Android APK

on:
  push:
    branches:
      - android-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile & Sign Standalone APK using Android SDK 34 Build-Tools
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls "$ANDROID_HOME/platforms/"android-*/android.jar | sort -V | tail -n 1)
          echo "Using BUILD_TOOLS=$BUILD_TOOLS"
          echo "Using PLATFORM_JAR=$PLATFORM_JAR"

          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/compiled_res" "$WORK_DIR/gen" "$WORK_DIR/classes" "$WORK_DIR/dex"
          mkdir -p releases

          # Sync latest root web assets into Android assets directory
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json android/app/src/main/assets/

          # 1. Compile resources with aapt2
          "$BUILD_TOOLS/aapt2" compile --dir android/app/src/main/res -o "$WORK_DIR/compiled_res/res.zip"

          # 2. Link resources, AndroidManifest.xml, and offline assets with aapt2
          "$BUILD_TOOLS/aapt2" link \
            -I "$PLATFORM_JAR" \
            --manifest android/app/src/main/AndroidManifest.xml \
            -A android/app/src/main/assets \
            --java "$WORK_DIR/gen" \
            --auto-add-overlay \
            -o "$WORK_DIR/unaligned.apk" \
            "$WORK_DIR/compiled_res/res.zip"

          # 3. Compile Java sources + generated R.java against android.jar
          find android/app/src/main/java "$WORK_DIR/gen" -name "*.java" > "$WORK_DIR/sources.txt"
          javac --release 11 -cp "$PLATFORM_JAR" -d "$WORK_DIR/classes" @"$WORK_DIR/sources.txt"

          # 4. Convert .class files to classes.dex using d8
          CLASS_FILES=$(find "$WORK_DIR/classes" -name "*.class")
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$PLATFORM_JAR" --output "$WORK_DIR/dex" $CLASS_FILES

          # 5. Add classes.dex into the APK
          (cd "$WORK_DIR/dex" && zip -uj "$WORK_DIR/unaligned.apk" classes.dex)

          # 6. Align APK on 4-byte boundary (required for Android 11+ / Android 14+ / OneUI 9)
          "$BUILD_TOOLS/zipalign" -p -f -v 4 "$WORK_DIR/unaligned.apk" "$WORK_DIR/aligned.apk"

          # 7. Generate signing keystore and sign with v1 + v2 + v3 schemes
          keytool -genkeypair -v \
            -keystore "$WORK_DIR/release.keystore" \
            -alias notpresso \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass notpresso123 -keypass notpresso123 \
            -dname "CN=Notpresso Expert, OU=OpenSource, O=AdelinaLuna, L=Local, S=Local, C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$WORK_DIR/release.keystore" \
            --ks-key-alias notpresso \
            --ks-pass pass:notpresso123 \
            --key-pass pass:notpresso123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out releases/notpresso-expert-en350g.apk \
            "$WORK_DIR/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify -v releases/notpresso-expert-en350g.apk
          ls -lh releases/notpresso-expert-en350g.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notpresso-expert-en350g-apk
          path: releases/notpresso-expert-en350g.apk

      - name: Commit Signed APK to releases/ folder on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/notpresso-expert-en350g.apk android/app/src/main/assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore(apk): build signed standalone notpresso-expert-en350g.apk [skip ci]"
            git push origin HEAD:android-apk
          fi
